<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রিজার্ভ গাড়ি সেবা | মনোহরদী ট্রান্সপোর্ট</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SolaimanLipi', Arial, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
        }
        header {
            background: linear-gradient(135deg, #134e5e, #71b280);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        header h2 {
            font-size: 1.2rem;
            font-weight: normal;
            opacity: 0.95;
        }
        .container {
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .nav-links {
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .nav-links a {
            display: inline-block;
            background: #134e5e;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 0.9rem;
            transition: background 0.3s;
        }
        .nav-links a:hover {
            background: #0b333e;
        }
        h3 {
            color: #134e5e;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .form-group {
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 1rem;
        }
        button {
            background: #134e5e;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1.1rem;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s ease;
        }
        button:hover {
            background: #0b333e;
        }
        footer {
            text-align: center;
            padding: 20px;
            background: #333;
            color: white;
            margin-top: 40px;
        }
        @media (max-width: 600px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>মনোহরদী রিজার্ভ গাড়ি ও ট্রান্সপোর্ট সেবা</h1>
        <h2>মনোহরদীর ভেতরে বা দেশের যেকোনো স্থানে নিরাপদ যাতায়াতের জন্য গাড়ি বুকিং করুন</h2>
    </header>

    <div class="container">
        <div class="nav-links">
            <a href="index.html">ম্যারেজ মিডিয়া</a>
            <a href="service.html">ইলেকট্রনিক্স সেবা</a>
        </div>

        <h3>রিজার্ভ গাড়ি বুকিং ফর্ম</h3>
        
        <form action="https://formspree.io/f/xzerrbwd" method="POST">
            <div class="form-group">
                <label for="passenger_name">যাত্রীর নাম:</label>
                <input type="text" id="passenger_name" name="passenger_name" placeholder="আপনার পূর্ণ নাম লিখুন" required>
            </div>

            <div class="form-group">
                <label for="vehicle_type">গাড়ির ধরন নির্বাচন করুন:</label>
                <select id="vehicle_type" name="vehicle_type">
                    <option value="cng">সিএনজি (CNG)</option>
                    <option value="easybike">অটোরিকশা / ইজিবাইক</option>
                    <option value="private_car">প্রাইভেট কার (৪ সিট)</option>
                    <option value="microbus">মাইক্রোবাস - নোয়াহ / হাইয়েস (৭-১২ সিট)</option>
                    <option value="ambulance">জরুরি অ্যাম্বুলেন্স (Ambulance)</option>
                    <option value="pickup">মালামাল পরিবহনের পিকআপ (Pickup)</option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="pickup_location">কোথা থেকে উঠবেন (পিকআপ পয়েন্ট):</label>
                    <input type="text" id="pickup_location" name="pickup_location" placeholder="যেমন: মনোহরদী বাসস্ট্যান্ড / চালাকচর" required>
                </div>

                <div class="form-group">
                    <label for="destination">কোথায় যাবেন (গন্তব্য):</label>
                    <input type="text" id="destination" name="destination" placeholder="যেমন: নরসিংদী / ঢাকা / শিবপুর" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="travel_date">যাত্রার তারিখ:</label>
                    <input type="date" id="travel_date" name="travel_date" required>
                </div>

                <div class="form-group">
                    <label for="travel_time">সম্ভাব্য সময়:</label>
                    <input type="time" id="travel_time" name="travel_time" required>
                </div>
            </div>

            <div class="form-group">
                <label for="trip_type">যাত্রার ধরন:</label>
                <select id="trip_type" name="trip_type">
                    <option value="one_way">শুধু যাওয়া (One Way / Drop)</option>
                    <option value="round_trip">যাওয়া এবং আসা (Round Trip / সারাদিন)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="contact">মোবাইল নম্বর:</label>
                <input type="tel" id="contact" name="contact" placeholder="যোগাযোগের নম্বর দিন" required>
            </div>

            <div class="form-group">
                <label for="notes">অতিরিক্ত তথ্য (যদি থাকে):</label>
                <textarea id="notes" name="notes" rows="2" placeholder="যাত্রী সংখ্যা বা বিশেষ কোনো নির্দেশনা থাকলে লিখুন"></textarea>
            </div>

            <input type="hidden" name="_next" value="thanks.html">
            <button type="submit">গাড়ি বুকিং নিশ্চিত করুন</button>
        </form>
    </div>

    <footer>
        <p>&copy; ২০২৬ মনোহরদী অনলাইন সেবা। সর্বস্বত্ব সংরক্ষিত।</p>
    </footer>

</body>
</html>

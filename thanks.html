<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ধন্যবাদ | নিকাহ-মনোহরদী</title>
    <style>
        body {
            font-family: 'SolaimanLipi', Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
        }
        h1 { color: #2a5298; margin-bottom: 15px; }
        p { color: #555; font-size: 1.1rem; margin-bottom: 25px; }
        a {
            display: inline-block;
            background: #2a5298;
            color: white;
            text-decoration: none;
            padding: 10px 25px;
            border-radius: 5px;
        }
        a:hover { background: #1e3c72; }
    </style>
</head>
<body>
    <div class="box">
        <h1>ধন্যবাদ!</h1>
        <p>আপনার তথ্য সফলভাবে আমাদের কাছে পৌঁছেছে। শীঘ্রই আমাদের প্রতিনিধি আপনার সাথে যোগাযোগ করবেন।</p>
        <a href="index.html">মূল পাতায় ফিরে যান</a>
    </div>
</body>
</html>
